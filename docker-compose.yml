# =============================================================================
# Docker Compose Suite - CoopBank Visit Hub
# Cooperative Bank of Oromia
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: coop-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coop_visit_db}
      POSTGRES_USER: ${POSTGRES_USER:-coop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coop_user} -d ${POSTGRES_DB:-coop_visit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. CoopBank Visit Hub Backend (Spring Boot Service)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Coop_Vsit_hub
      dockerfile: Dockerfile
    container_name: coop-visit-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-coop_visit_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-coop_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coop_secure_pass}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-10.12.150.151}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-noreply@coopbankoromiasc.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      COOPBANK_APP_FRONTEND_URL: ${FRONTEND_URL:-https://coop-vsit-hub.vercel.app}
      APP_FRONTEND_URL: ${FRONTEND_URL:-https://coop-vsit-hub.vercel.app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://10.8.101.150,http://10.8.101.150:*}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AD_ENABLED: ${AD_ENABLED:-false}
      AD_URL: ${AD_URL:-ldaps://10.1.72.10:636}
      AD_BASE_DN: ${AD_BASE_DN:-DC=coopbank,DC=local}
      AD_USERNAME: ${AD_USERNAME:-}
      AD_PASSWORD: ${AD_PASSWORD:-}
      AD_SSL_TRUST_ALL: ${AD_SSL_TRUST_ALL:-false}
      JAVA_TOOL_OPTIONS: "-Dcom.sun.jndi.ldap.object.disableEndpointIdentification=true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
