# =============================================================================
# CoopBank Visit Hub - Application Configuration
# Cooperative Bank of Oromia (CoopBank DxValley)
# =============================================================================

# Spring Application Name
spring.application.name=Coop_Vsit_hub

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coop_visit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coop_secure_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Redis Configuration (JWT Blacklist & Session Storage)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# MailHog SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.from=${SPRING_MAIL_FROM:no-reply@coopbank.com.et}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application Base URL (Used for Email Verification & Password Reset Links)
coopbank.app.base-url=${APP_BASE_URL:http://localhost:8080}

# Servlet & File Upload Limits (Security NFR #10)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Security & JWT Configuration
coopbank.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
coopbank.security.jwt.access-token-expiration-ms=900000
coopbank.security.jwt.refresh-token-expiration-ms=604800000
coopbank.security.brute-force.max-attempts=5
coopbank.security.brute-force.lock-duration-minutes=15
coopbank.security.rate-limit.requests-per-minute=60

# Springdoc OpenAPI / Swagger UI Settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.coop_vsit_hub=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# Server Settings
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
